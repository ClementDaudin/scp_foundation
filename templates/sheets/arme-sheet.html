<form class="flexcol {{cssClass}} arme-sheet" autocomplete="off">
    {{> "systems/scp_foundation/templates/partials/item-header.html"}}

    <section class="sheet-body">
        <div class="item-section">
            <p class="item-section-title">Compétence &amp; Recul</p>
            <div class="item-fields">
                <label class="input-label stacked">
                    <select name="system.skill" id="skill">
                        <option value="handgun">Arme de poing</option>
                        <option value="heavy_artillery">Artillerie lourde</option>
                        <option value="hunting_sniper_rifle">Chasse / Sniper</option>
                        <option value="shotgun">Fusil à pompe</option>
                        <option value="assault_rifle">Fusil d'assaut</option>
                        <option value="melee">Mêlée</option>
                        <option value="submachine_gun">Mitraillette</option>
                        <option value="catch_throw">Lancer / Rattraper</option>
                        <option value="demolition">Démolition</option>
                    </select>
                    <span>Compétence</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.recoil.base" type="text" value="{{systemData.recoil.base}}" placeholder="0">
                    <span>Recul de base</span>
                </label>
            </div>
        </div>

        <div class="item-section">
            <p class="item-section-title">Valeurs de position</p>
            <div class="item-fields">
                <label class="input-label stacked">
                    <input name="system.melee" type="number" value="{{systemData.melee}}" placeholder="0">
                    <span>Mêlée</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.hip" type="number" value="{{systemData.hip}}" placeholder="0">
                    <span>Hip</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.ready" type="number" value="{{systemData.ready}}" placeholder="0">
                    <span>Ready</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.aim" type="number" value="{{systemData.aim}}" placeholder="0">
                    <span>Aim</span>
                </label>
            </div>
        </div>

        <div class="item-section">
            <p class="item-section-title">Dégâts &amp; Chargeur</p>
            <div class="item-fields">
                <label class="input-label stacked">
                    <input name="system.base_damage" type="text" value="{{systemData.base_damage}}" placeholder="ex: 2d6">
                    <span>Base</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.x_damage" type="text" value="{{systemData.x_damage}}" placeholder="1">
                    <span>× Dégâts</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.element" type="text" value="{{systemData.element}}" placeholder="—">
                    <span>Élément</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.magazine.max" type="number" value="{{systemData.magazine.max}}" placeholder="0">
                    <span>Chargeur</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.range" type="text" value="{{systemData.range}}" placeholder="—">
                    <span>Portée</span>
                </label>
                <label class="input-label stacked">
                    <input name="system.price" type="text" value="{{systemData.price}}" placeholder="—">
                    <span>Prix</span>
                </label>
            </div>
        </div>

        <div class="item-section item-section--description">
            <p class="item-section-title">Description</p>
            {{editor descriptionHTML target="system.description" button=true editable=editable engine="prosemirror"}}
        </div>
    </section>
</form>
